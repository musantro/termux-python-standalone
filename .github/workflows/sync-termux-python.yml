name: Sync Python Foundation releases

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-foundation-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Check Python Foundation releases
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SYNC_PR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Synchronize Python Foundation releases
        run: |
          set -euo pipefail
          ./scripts/sync-python-releases.py versions.json
          ./scripts/validate-versions.py versions.json

      - name: Commit synchronized manifest directly to main
        run: |
          if git diff --quiet -- versions.json; then
            echo "No new CPython releases detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "sync Python Foundation releases"
          git push origin HEAD:main
