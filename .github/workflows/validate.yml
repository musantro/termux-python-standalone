name: Validate metadata and scripts

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v6
      - name: Validate catalog example
        run: ./scripts/validate-metadata.py metadata/python-downloads.example.json
      - name: Validate version manifest
        run: |
          ./scripts/validate-versions.py versions.json
          ./scripts/render-matrix.py versions.json
      - name: Validate uv catalog selection
        run: |
          uv python list --only-downloads --show-urls \
            --python-downloads-json-url "file://$GITHUB_WORKSPACE/metadata/python-downloads.example.json"
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate Python scripts
        run: python -m py_compile scripts/*.py
      - name: Test recipe preparation
        run: python scripts/test-prepare-termux-python-recipe.py
      - name: Test recipe compatibility
        run: python tests/test-override-termux-python-recipe.py -v
